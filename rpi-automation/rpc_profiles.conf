# Ablation profiles for the peer-branch RPC optimizations.
#
# Each non-comment line is:  <profile-name>  [KEY=VAL ...]
# The env vars are applied IDENTICALLY to the client (llama-cli on the coordinator)
# AND every rpc-server -- the optimization gates must match on all nodes. Consumed by
# ablate.sh. The master switch RPC_NO_OPT=1 = faithful baseline (every opt off, same binary).
#
# A profile with no env vars runs the fully-optimized default path -- which now INCLUDES
# persist-buffers + prefetch + graph-oneway (the byte-identical wins, graduated to default-on;
# ~6.1x decode vs the batching baseline). To ablate one, flip it OFF with its RPC_NO_* opt-out.
#
# Gates (see ggml-rpc.cpp / ENV_VARS.md): RPC_NO_OPT (master baseline); default-on opt-outs
# RPC_NO_PERSIST_BUFFERS / RPC_NO_PREFETCH / RPC_NO_GRAPH_ONEWAY / RPC_NO_WEIGHT_CACHE;
# opt-in RPC_AR_PARTIAL=fp16|int8|int8b|fp8 (all-reduce precision tradeoff), RPC_AR_TREE,
# RPC_SERIAL_UPLOAD. (RPC_DIFF_DATA_TRIM is EXPERIMENTAL+UNSAFE -- omitted.)

baseline            RPC_NO_OPT=1
optimized

# --- reduced-precision all-reduce partials (opt-in; NOT bit-identical, a quality tradeoff) ---
opt+fp16            RPC_AR_PARTIAL=fp16
opt+int8b           RPC_AR_PARTIAL=int8b
opt+tree            RPC_AR_TREE=1
opt+tree+fp16       RPC_AR_TREE=1 RPC_AR_PARTIAL=fp16

# --- ablations: turn ONE default-on win OFF to measure its contribution ---
opt-no-persist      RPC_NO_PERSIST_BUFFERS=1
opt-no-prefetch     RPC_NO_PREFETCH=1
opt-no-oneway       RPC_NO_GRAPH_ONEWAY=1
opt-no-persist-pf   RPC_NO_PERSIST_BUFFERS=1 RPC_NO_PREFETCH=1
