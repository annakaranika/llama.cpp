# Ablation profiles for the peer-branch RPC optimizations.
#
# Each non-comment line is:  <profile-name>  [KEY=VAL ...]
# The env vars are applied IDENTICALLY to the client (llama-cli on the coordinator)
# AND every rpc-server -- the optimization gates must match on all nodes. Consumed by
# ablate.sh. The master switch RPC_NO_OPT=1 = faithful baseline (every opt off, same binary).
#
# A profile with no env vars runs the fully-optimized default path.
#
# Gates (see ggml-rpc.cpp): RPC_NO_OPT (master baseline), RPC_AR_TREE (tree all-reduce),
# RPC_AR_PARTIAL=fp16|int8|f32 (narrowed all-reduce partials; RPC_AR_FP16=1 == fp16),
# RPC_NO_WEIGHT_CACHE, RPC_SERIAL_UPLOAD. (RPC_DIFF_DATA_TRIM is EXPERIMENTAL+UNSAFE -- omitted.)

baseline        RPC_NO_OPT=1
optimized
opt+fp16        RPC_AR_PARTIAL=fp16
opt+int8        RPC_AR_PARTIAL=int8
opt+tree        RPC_AR_TREE=1
opt+tree+fp16   RPC_AR_TREE=1 RPC_AR_PARTIAL=fp16
